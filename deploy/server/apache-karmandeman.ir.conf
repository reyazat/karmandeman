# Apache vhost for karmandeman.ir on the ISPConfig host (5.78.96.78).
# Not an ISPConfig-managed site: installed by hand as
# /etc/apache2/sites-available/karmandeman.ir.conf and enabled with a2ensite.
# Certificates come from certbot (webroot below); Apache terminates TLS and
# proxies to Caddy on 127.0.0.1:8090.

<VirtualHost *:80>
    ServerName karmandeman.ir
    ServerAlias www.karmandeman.ir

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://karmandeman.ir%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfFile /etc/letsencrypt/live/karmandeman.ir/fullchain.pem>
<VirtualHost *:443>
    ServerName karmandeman.ir
    ServerAlias www.karmandeman.ir

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/karmandeman.ir/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/karmandeman.ir/privkey.pem

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://karmandeman.ir%{REQUEST_URI} [R=301,L]

    # Caddy trusts these from Apache (private range) and passes them to Laravel.
    # A client's own forwarded host or prefix is dropped before mod_proxy adds
    # the real one, so the browser cannot choose the host Laravel sees.
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Prefix early
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8090/ retry=0 timeout=180
    ProxyPassReverse / http://127.0.0.1:8090/
    # Matches Caddy's request_body limit.
    LimitRequestBody 26214400
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/karmandeman.ir-error.log
    CustomLog ${APACHE_LOG_DIR}/karmandeman.ir-access.log combined
</VirtualHost>
</IfFile>
